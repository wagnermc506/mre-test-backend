services:

  backend:
    build: .
    container_name: backend
    restart: always
    ports:
      - 3000:3000
    volumes:
      - './:/app'
    environment:
      DB_HOST: db
    depends_on:
      - db

  db:
    image: postgres:18
    restart: always
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: strongpassword1234
      POSTGRES_DB: applicationdb

volumes:
  db-data:
